name: release
run-name: Build binaries and publish a release

# Push a tag matching the Cargo.toml version (e.g. v0.1.0) to publish a release.
# Running it manually only builds the archives, as run artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        # envgg is the CLI with the GUI manager, envgg-headless is the CLI alone.
        # Both build a binary called `envgg`.
        package: [envgg, envgg-headless]
        platform: [linux, macos-x86_64, macos-aarch64, windows]
        include:
          - platform: linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
          - platform: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
          - platform: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies (headless)
        if: runner.os == 'Linux' && matrix.package == 'envgg-headless'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev

      - name: Install Linux dependencies (GUI)
        if: runner.os == 'Linux' && matrix.package == 'envgg'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --package ${{ matrix.package }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir dist
          tar -czf dist/${{ matrix.package }}-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release envgg

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist
          Compress-Archive -Path target\${{ matrix.target }}\release\envgg.exe -DestinationPath dist\${{ matrix.package }}-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}-${{ matrix.target }}
          path: dist/*
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
