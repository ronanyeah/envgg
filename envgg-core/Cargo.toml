[package]
name = "envgg-core"
version.workspace = true
edition.workspace = true
description = "Run commands with environment variables from .env files, with secrets resolved from the system keyring"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
clap-markdown = "0.1.5"
indexmap = "2.14.2"
keyring-core = "1.0.0"
rpassword = "7.5.4"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0", features = [
  "crypto-rust",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1"
